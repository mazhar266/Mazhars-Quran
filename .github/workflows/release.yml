name: Release

# Runs only when a version tag such as v1.0.0 is pushed: runs the unit tests,
# builds the APK and publishes a GitHub Release with it. Ordinary commits,
# branches and pull requests do not start it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  LLAMA_CPP_TAG: b12360
  WHISPER_CPP_TAG: v1.9.5
  NDK_VERSION: 28.2.13676358
  CMAKE_VERSION: 3.22.1

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        run: ./gradlew :shared:jvmTest --console=plain

  release:
    name: Build APK and publish release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      # GitHub's Ubuntu runners ship the Android SDK; only the pinned NDK and CMake need adding.
      - name: Install NDK and CMake
        run: |
          sdkmanager="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      # llama.cpp and whisper.cpp are not vendored; the build expects them here at pinned tags.
      - name: Fetch native sources
        run: |
          git clone --depth 1 --branch "$LLAMA_CPP_TAG" https://github.com/ggml-org/llama.cpp.git .local/llama.cpp
          git clone --depth 1 --branch "$WHISPER_CPP_TAG" https://github.com/ggml-org/whisper.cpp.git .local/whisper.cpp

      # v1.2.3 -> 1.2.3
      - name: Work out the version
        id: version
        run: |
          name="${GITHUB_REF_NAME#v}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Building version $name (code $GITHUB_RUN_NUMBER)"

      - name: Build release APK
        run: >
          ./gradlew :androidApp:assembleRelease --console=plain
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ github.run_number }}

      - name: Name the APK
        id: apk
        run: |
          out="Mazhars-Quran-${{ steps.version.outputs.name }}.apk"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "$out"
          sha256sum "$out" > "$out.sha256"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          ls -l "$out"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Mazhar's Quran ${{ steps.version.outputs.name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
