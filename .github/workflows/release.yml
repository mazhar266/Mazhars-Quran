name: Build and release

# - Every push and pull request: run the unit tests.
# - Pushes to main: also build the APK and keep it as a workflow artifact.
# - Tags like v1.0.0: also publish a GitHub Release with the APK attached.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  LLAMA_CPP_TAG: b12360
  WHISPER_CPP_TAG: v1.9.5
  NDK_VERSION: 28.2.13676358
  CMAKE_VERSION: 3.22.1

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        run: ./gradlew :shared:jvmTest --console=plain

  apk:
    name: Build APK
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      # GitHub's Ubuntu runners ship the Android SDK; only the pinned NDK and CMake need adding.
      - name: Install NDK and CMake
        run: |
          sdkmanager="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      # llama.cpp and whisper.cpp are not vendored; the build expects them here at pinned tags.
      - name: Fetch native sources
        run: |
          git clone --depth 1 --branch "$LLAMA_CPP_TAG" https://github.com/ggml-org/llama.cpp.git .local/llama.cpp
          git clone --depth 1 --branch "$WHISPER_CPP_TAG" https://github.com/ggml-org/whisper.cpp.git .local/whisper.cpp

      - name: Work out the version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="$(sed -n 's/^app = "\(.*\)"$/\1/p' gradle/libs.versions.toml)-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Building version $name (code $GITHUB_RUN_NUMBER)"

      - name: Build release APK
        run: >
          ./gradlew :androidApp:assembleRelease --console=plain
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ github.run_number }}

      - name: Name the APK
        id: apk
        run: |
          out="Mazhars-Quran-${{ steps.version.outputs.name }}.apk"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "$out"
          sha256sum "$out" > "$out.sha256"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          ls -l "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Mazhar's Quran ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
